[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]
# The GBA profile aborts on panic. `cargo test` otherwise rebuilds core for
# unwinding and links that core beside the abort one.
panic-abort-tests = true

[build]
target = "thumbv4t-none-eabi"

[target.thumbv4t-none-eabi]
rustflags = [
    "-Clink-arg=-Tgba.ld",
    "-Ctarget-cpu=arm7tdmi",
    "-Cforce-frame-pointers=yes",
]
rustdocflags = [
    "-Clink-arg=-Tgba.ld",
    "-Ctarget-cpu=arm7tdmi",
    "-Cforce-frame-pointers=yes",
]

# `cargo run` opens mGBA, `cargo test` runs headless. See the script.
runner = "tools/run.sh"
